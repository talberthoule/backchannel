<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and effects -->
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#fcfcfd" />

  <!-- Section: Client Layer -->
  <g transform="translate(50, 50)">
    <rect width="320" height="700" rx="24" fill="white" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="1" />
    <text x="160" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="18" fill="#1e293b">CLIENT LAYER (React)</text>

    <!-- Audio Capture -->
    <g transform="translate(20, 70)">
      <rect width="280" height="180" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="140" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">DUAL-TRACK AUDIO CAPTURE</text>
      <rect x="40" y="45" width="200" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" />
      <text x="140" y="66" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">Mic track (0x00)</text>
      <rect x="40" y="85" width="200" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1" />
      <text x="140" y="106" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">Tab/system track (0x01)</text>
      <rect x="40" y="128" width="200" height="36" rx="8" fill="url(#blueGrad)" />
      <text x="140" y="151" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="white">PCM16 16kHz Stream</text>
    </g>

    <!-- WebSocket Client -->
    <g transform="translate(20, 270)">
      <rect width="280" height="110" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="140" y="35" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">WEBSOCKET MANAGER</text>
      <rect x="40" y="52" width="200" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" />
      <text x="140" y="75" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#475569">Bi-directional Events</text>
    </g>

    <!-- UI Views -->
    <g transform="translate(20, 400)">
      <rect width="280" height="280" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="140" y="35" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">UI COMPONENTS</text>

      <rect x="40" y="55" width="200" height="60" rx="8" fill="white" stroke="#e2e8f0" />
      <text x="140" y="90" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#475569">Pre-Call Setup</text>

      <rect x="40" y="125" width="200" height="60" rx="8" fill="white" stroke="#0d9488" stroke-width="2" />
      <text x="140" y="160" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="12" fill="#0d9488">Active Call Dashboard</text>

      <rect x="40" y="195" width="200" height="60" rx="8" fill="white" stroke="#e2e8f0" />
      <text x="140" y="230" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#475569">Post-Call Review</text>
    </g>
  </g>

  <!-- Section: Backend Layer -->
  <g transform="translate(420, 50)">
    <rect width="360" height="700" rx="24" fill="white" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="1" />
    <text x="180" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="18" fill="#1e293b">BACKEND LAYER (FastAPI)</text>

    <!-- Real-time pipeline -->
    <g transform="translate(30, 70)">
      <rect width="300" height="180" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="150" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">REAL-TIME PIPELINE</text>

      <rect x="30" y="45" width="240" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" />
      <text x="150" y="67" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#475569">Audio WebSocket Handler</text>

      <rect x="30" y="87" width="240" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" />
      <text x="150" y="109" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#475569">Silero VAD + WeSpeaker Diarization</text>

      <rect x="30" y="129" width="240" height="34" rx="8" fill="#ffffff" stroke="#fca5a5" />
      <text x="150" y="151" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#991b1b">Audio Gateway (interim relay)</text>
    </g>

    <!-- Transcriber -->
    <g transform="translate(30, 280)">
      <rect width="300" height="100" rx="16" fill="#f1f5f9" stroke="#e2e8f0" />
      <text x="150" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">BATCH TRANSCRIBER</text>
      <rect x="30" y="45" width="240" height="40" rx="8" fill="url(#orangeGrad)" />
      <text x="150" y="70" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="12" fill="white">Gemini / Local ONNX (per model)</text>
    </g>

    <!-- Agent Orchestrator -->
    <g transform="translate(30, 410)">
      <rect width="300" height="260" rx="16" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="150" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="15" fill="#1d4ed8">AGENT ORCHESTRATOR</text>

      <!-- Event Bus -->
      <rect x="20" y="45" width="260" height="34" rx="8" fill="white" stroke="#93c5fd" />
      <text x="150" y="67" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#1e40af">Transcript Buffer + Event Bus</text>

      <!-- Agent Grid -->
      <g transform="translate(20, 92)">
        <rect width="125" height="70" rx="8" fill="white" stroke="#e2e8f0" />
        <text x="62" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#475569">Consolidated Analyst</text>
        <text x="62" y="48" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8">(insights, 15s)</text>

        <rect x="135" y="0" width="125" height="70" rx="8" fill="white" stroke="#e2e8f0" />
        <text x="197" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#475569">Objection Handler</text>
        <text x="197" y="48" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8">(fast scan, 5s)</text>

        <rect x="0" y="80" width="125" height="70" rx="8" fill="white" stroke="#e2e8f0" />
        <text x="62" y="30" dy="80" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#475569">Synthesizer</text>
        <text x="62" y="48" dy="80" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8">(reconciles insights)</text>

        <rect x="135" y="80" width="125" height="70" rx="8" fill="white" stroke="#e2e8f0" />
        <text x="197" y="30" dy="80" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#475569">Opportunity Specialist</text>
        <text x="197" y="48" dy="80" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#94a3b8">(offering matches)</text>
      </g>
    </g>
  </g>

  <!-- Section: AI Layer -->
  <g transform="translate(830, 50)">
    <rect width="320" height="360" rx="24" fill="white" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="1" />
    <text x="160" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="18" fill="#1e293b">AI MODELS (provider-routed)</text>

    <g transform="translate(20, 60)">
      <rect width="280" height="90" rx="16" fill="#fef2f2" stroke="#fecaca" />
      <text x="140" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#991b1b">LIVE GATEWAY</text>
      <text x="140" y="55" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#b91c1c">Gemini Live / OpenAI Realtime</text>
      <text x="140" y="75" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#dc2626">Interim transcription only</text>
    </g>

    <g transform="translate(20, 160)">
      <rect width="280" height="90" rx="16" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="140" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#166534">TEXT + BATCH LLMs</text>
      <text x="140" y="55" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#15803d">Gemini 3.x / OpenAI (model registry)</text>
      <text x="140" y="75" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#16a34a">Agent analysis + transcription</text>
    </g>

    <g transform="translate(20, 260)">
      <rect width="280" height="80" rx="16" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="140" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#475569">LOCAL ONNX ASR</text>
      <text x="140" y="55" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#64748b">Whisper / Parakeet -- offline, no API key</text>
    </g>
  </g>

  <!-- Section: Persistence -->
  <g transform="translate(830, 430)">
    <rect width="320" height="320" rx="24" fill="white" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="1" />
    <text x="160" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="18" fill="#1e293b">PERSISTENCE</text>

    <g transform="translate(20, 55)">
      <rect width="280" height="175" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="140" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">POSTGRESQL DB</text>

      <g transform="translate(30, 55)">
        <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">├─ Sessions &amp; Call Segments</text>
        <text x="0" y="22" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">├─ Speakers &amp; Transcripts</text>
        <text x="0" y="44" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">├─ Insights (all types)</text>
        <text x="0" y="66" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">├─ Directives &amp; Documents</text>
        <text x="0" y="88" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">├─ Agent Configs &amp; Overrides</text>
        <text x="0" y="110" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">└─ Credentials &amp; Offerings</text>
      </g>
    </g>

    <g transform="translate(20, 245)">
      <rect width="280" height="60" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="140" y="25" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">AUDIO STORE (disk)</text>
      <text x="140" y="47" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#475569">DATA_DIR/audio/&lt;session&gt;/segment_&lt;n&gt;.wav</text>
    </g>
  </g>

  <!-- Connections -->
  <!-- Client to Backend (Audio) -->
  <path d="M 370 160 L 420 160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="395" y="150" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748b">PCM16 + prefix</text>

  <!-- Client to Backend (Events) -->
  <path d="M 370 340 L 420 340" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="4" />
  <text x="395" y="330" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748b">JSON Events</text>

  <!-- Backend to AI (Live) -->
  <path d="M 780 155 L 830 155" stroke="#fecaca" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="805" y="145" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#991b1b">Audio Stream</text>

  <!-- Backend to AI (Text) -->
  <path d="M 780 255 L 830 255" stroke="#bbf7d0" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="805" y="245" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#166534">Prompts / Segments</text>

  <!-- Backend to Persistence (SQL) -->
  <path d="M 780 575 L 830 575" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="805" y="565" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748b">SQL</text>

  <!-- Backend to Persistence (WAV) -->
  <path d="M 780 705 L 830 705" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="805" y="695" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748b">WAV Segments</text>

  <!-- Pipeline flow -->
  <path d="M 610 302 L 610 328" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrowhead)" />
  <path d="M 610 432 L 610 458" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrowhead)" />
</svg>
