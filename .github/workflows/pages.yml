name: Deploy site and docs to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/**"
      - "docs-site/**"
      - "architecture.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Build docs
        run: |
          npm ci
          npm run build
        working-directory: docs-site
      - name: Assemble site (landing page at /, docs at /docs/)
        run: |
          mkdir _site
          cp -r site/* _site/
          cp -r docs-site/dist _site/docs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
