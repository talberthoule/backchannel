name: Site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/**"
      - "docs-site/**"
      - "architecture.svg"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      # Not npm ci: the lockfile is generated on Windows and npm omits other
      # platforms' optional native packages (sharp, rolldown) from it — and
      # npm install trusts the incomplete lock (npm/cli#4828). Resolve fresh.
      - run: rm -f package-lock.json && npm install
      - run: npm run build
      # Requires repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit) and CLOUDFLARE_ACCOUNT_ID
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs-site
          command: deploy
          # The action's bundled default (wrangler 3.x) predates wrangler.jsonc
          # support and dies with "Missing entry-point". Match docs-site/package.json.
          #
          # Must stay outside the miniflare -> sharp libvips advisory range, which
          # covers wrangler 4.16.0-4.113.0 (ALP-190). 4.114.0 is the lowest release
          # that clears it, but package.json's caret resolves to 4.115.0 and the
          # build step above deletes the lockfile, so CI tests 4.115.0. Pinning the
          # deploy lower than what the suites run would be skew for no benefit.
          wranglerVersion: "4.115.0"
      # Ping the Bing/IndexNow index (feeds Copilot citations) with every URL
      # from both sitemaps. The key file is served from the site root; failed
      # pings never fail the deploy.
      - name: IndexNow ping
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const urls = ["dist-site/sitemap.xml", "dist-site/docs/sitemap-0.xml"].flatMap(
              (f) => [...readFileSync(f, "utf8").matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1])
            );
            const body = JSON.stringify({
              host: "backchannel.page",
              key: "680ca020efcbb5315ac482170309416d",
              keyLocation: "https://backchannel.page/680ca020efcbb5315ac482170309416d.txt",
              urlList: urls,
            });
            const res = await fetch("https://api.indexnow.org/indexnow", {
              method: "POST",
              headers: { "Content-Type": "application/json; charset=utf-8" },
              body,
            });
            console.log("IndexNow:", res.status, "for", urls.length, "URLs");
          ' || echo "IndexNow ping failed (non-fatal)"
