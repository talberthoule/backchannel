name: Desktop release
run-name: Desktop release ${{ inputs.release_ref }} (${{ inputs.correlation_id }})

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Canonical annotated release tag
        required: true
        type: string
      expected_commit:
        description: Expected peeled release commit
        required: true
        type: string
      correlation_id:
        description: Unique coordinator dispatch correlation
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      published_at: ${{ steps.release.outputs.published_at }}
      cache_key: ${{ steps.handoff.outputs.cache_key }}
      bundle_sha256: ${{ steps.handoff.outputs.bundle_sha256 }}
    steps:
      - name: Checkout controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: controller

      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          path: source

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify annotated release tag
        id: release
        working-directory: source
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORRELATION_ID" =~ ^[0-9a-f]{32}$ ]]
          [[ "$(git cat-file -t "refs/tags/$RELEASE_REF")" == tag ]]
          actual_commit="$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")"
          [[ "$actual_commit" == "$EXPECTED_COMMIT" ]]
          tagger_date="$(git for-each-ref --format='%(taggerdate:iso-strict)' "refs/tags/$RELEASE_REF")"
          [[ -n "$tagger_date" ]]
          published_at="$(python - "$tagger_date" <<'PY'
          import sys
          from datetime import datetime, timezone

          value = datetime.fromisoformat(sys.argv[1])
          if value.tzinfo is None:
              raise SystemExit("annotated tag timestamp has no timezone")
          print(value.astimezone(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"))
          PY
          )"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: pip install -r source/backend/requirements.txt -r source/desktop/requirements.txt

      - name: Download ONNX models
        working-directory: source/backend
        run: python scripts/download_models.py

      - name: Download embedded Postgres
        run: python source/desktop/scripts/download_pg.py

      - name: Build bundle
        working-directory: source
        run: pyinstaller desktop/backchannel.spec --distpath dist --workpath build --noconfirm

      - name: Smoke test bundle
        working-directory: source
        run: python desktop/scripts/smoke_test.py

      - name: Zip macOS bundle
        working-directory: source
        run: |
          mkdir -p ../controller/release-assets
          ditto -c -k --keepParent dist/Backchannel.app ../controller/release-assets/Backchannel-macos-arm64.zip

      - name: Smoke test macOS update archive
        working-directory: source
        run: python desktop/scripts/smoke_update_archive.py --platform macos-arm64 --archive ../controller/release-assets/Backchannel-macos-arm64.zip

      - name: Prepare macOS cache handoff
        id: handoff
        working-directory: controller
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_sha256="$(shasum -a 256 release-assets/Backchannel-macos-arm64.zip | awk '{print $1}')"
          cache_key="backchannel-macos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_COMMIT}-${bundle_sha256}"
          echo "bundle_sha256=$bundle_sha256" >> "$GITHUB_OUTPUT"
          echo "cache_key=$cache_key" >> "$GITHUB_OUTPUT"

      - name: Save macOS handoff
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: controller/release-assets/Backchannel-macos-arm64.zip
          key: ${{ steps.handoff.outputs.cache_key }}

  publish-macos:
    needs: build-macos
    runs-on: macos-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: backchannel-r2-publish
      cancel-in-progress: false
    steps:
      - name: Checkout controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: controller

      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_ref }}
          path: source

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install signing dependency
        run: pip install "cryptography>=41.0.0"

      - name: Restore exact macOS handoff
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: controller/release-assets/Backchannel-macos-arm64.zip
          key: ${{ needs.build-macos.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Verify macOS handoff digest
        working-directory: controller
        env:
          BUNDLE_SHA256: ${{ needs.build-macos.outputs.bundle_sha256 }}
        shell: bash
        run: echo "$BUNDLE_SHA256  release-assets/Backchannel-macos-arm64.zip" | shasum -a 256 -c -

      - name: Publish verified macOS platform
        working-directory: source
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_RELEASES_BUCKET: ${{ vars.R2_RELEASES_BUCKET }}
          BACKCHANNEL_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.BACKCHANNEL_RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_REF: ${{ inputs.release_ref }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PUBLISHED_AT: ${{ needs.build-macos.outputs.published_at }}
        shell: pwsh
        run: ./scripts/publish_release_platform.ps1 -Version $env:RELEASE_REF -Commit $env:EXPECTED_COMMIT -PublishedAt $env:PUBLISHED_AT -PlatformId macos-arm64 -AssetPath ../controller/release-assets/Backchannel-macos-arm64.zip -Confirm:$false

  cleanup-macos:
    needs: [build-macos, publish-macos]
    if: ${{ always() && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete exact macOS handoff cache
        env:
          CACHE_KEY: ${{ needs.build-macos.outputs.cache_key }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cache_id=""
          matches=0
          while IFS=$'\t' read -r returned_id returned_key returned_ref; do
            if [[ "$returned_key" == "$CACHE_KEY" && "$returned_ref" == "$GITHUB_REF" ]]; then
              cache_id="$returned_id"
              matches=$((matches + 1))
            fi
          done < <(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" -f key="$CACHE_KEY" -f ref="$GITHUB_REF" --jq '.actions_caches[] | [.id, .key, .ref] | @tsv')
          [[ "$matches" -eq 1 ]]
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
