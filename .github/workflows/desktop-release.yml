name: Desktop release
run-name: Desktop release ${{ inputs.release_ref }} (${{ inputs.correlation_id }})

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Canonical annotated release tag
        required: true
        type: string
      expected_commit:
        description: Expected peeled release commit
        required: true
        type: string
      correlation_id:
        description: Unique coordinator dispatch correlation
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: backchannel-r2-publish
      cancel-in-progress: false
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          path: controller

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          path: source

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify annotated release tag
        id: release
        working-directory: source
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CORRELATION_ID" =~ ^[0-9a-f]{32}$ ]]
          [[ "$(git cat-file -t "refs/tags/$RELEASE_REF")" == tag ]]
          actual_commit="$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")"
          [[ "$actual_commit" == "$EXPECTED_COMMIT" ]]
          tagger_date="$(git for-each-ref --format='%(taggerdate:iso-strict)' "refs/tags/$RELEASE_REF")"
          [[ -n "$tagger_date" ]]
          published_at="$(python - "$tagger_date" <<'PY'
          import sys
          from datetime import datetime, timezone

          value = datetime.fromisoformat(sys.argv[1])
          if value.tzinfo is None:
              raise SystemExit("annotated tag timestamp has no timezone")
          print(value.astimezone(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"))
          PY
          )"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: pip install -r source/backend/requirements.txt -r source/desktop/requirements.txt

      - name: Download ONNX models
        working-directory: source/backend
        run: python scripts/download_models.py

      - name: Download embedded Postgres
        run: python source/desktop/scripts/download_pg.py

      - name: Build bundle
        working-directory: source
        run: pyinstaller desktop/backchannel.spec --distpath dist --workpath build --noconfirm

      - name: Smoke test bundle
        working-directory: source
        run: python desktop/scripts/smoke_test.py

      - name: Zip macOS bundle
        working-directory: source
        run: ditto -c -k --keepParent dist/Backchannel.app ../controller/Backchannel-macos-arm64.zip

      - name: Publish verified macOS platform
        working-directory: controller
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_RELEASES_BUCKET: ${{ vars.R2_RELEASES_BUCKET }}
          RELEASE_REF: ${{ inputs.release_ref }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
        shell: pwsh
        run: ./scripts/publish_release_platform.ps1 -Version $env:RELEASE_REF -Commit $env:EXPECTED_COMMIT -PublishedAt $env:PUBLISHED_AT -PlatformId macos-arm64 -AssetPath Backchannel-macos-arm64.zip -Confirm:$false
