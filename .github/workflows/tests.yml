name: Tests

# The repository's test gate (ALP-184). Before this existed nothing in CI ran a
# suite, which is how four new frontend test files sat unregistered in
# package.json's hardcoded "test" list and silently skipped 15 tests (ALP-178).
#
# Deliberately not here: security scanners belong in their own workflow so a new
# CVE advisory cannot block an unrelated code PR, and the Sentrux structural gate
# is red on a clean master today (ALP-183).

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Backend and desktop suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must be 3.12, matching backend/Dockerfile (python:3.12-slim).
          # onnxruntime==1.21.1 has no wheel for 3.13+, so a newer interpreter
          # fails during dependency resolution rather than in any test.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      # scripts/download_models.py is deliberately NOT run: the suite reports
      # zero errors without the ONNX weights, so pulling them would add minutes
      # of download for no coverage.
      - name: Backend suite
        working-directory: backend
        run: python -m unittest discover -s tests

      # The repo root has to be importable: two modules import `desktop.*`, and
      # without this discovery drops them and reports 94 tests instead of 111.
      - name: Desktop suite
        working-directory: desktop
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci, so this suite runs the tree that actually ships. All three
      # desktop release paths install the frontend from this committed lockfile
      # with npm ci, which honours it exactly:
      #   scripts/release_desktop.ps1:354            Windows x64
      #   desktop/Dockerfile.release-linux:5         Linux x64
      #   .github/workflows/desktop-release.yml:86   macOS arm64
      # Resolving fresh here validated a different tree - measured ~350 lines of
      # package-lock.json apart - so bundles shipped versions nothing had run.
      #
      # This step used to delete the lockfile to dodge npm/cli#4828, on the
      # premise that a Windows-generated lockfile omits other platforms'
      # optional native packages. That premise is obsolete under npm 11: the
      # committed lockfile carries all 52 platform-constrained entries,
      # including @rollup/rollup-linux-x64 (the binary that rationale named)
      # and every @esbuild linux arch. See ALP-198 for the full disproof.
      #
      # Intended consequence: package.json and the lockfile must stay in sync
      # or npm ci fails, so dependency changes become explicit commits rather
      # than silent per-run drift.
      - run: npm ci
      # npm test is a hardcoded file list. A new *.test.mjs file must be added to
      # it or it will not run here (ALP-178).
      - run: npm test
      # This is also the repository's only typecheck: build runs tsc.
      - run: npm run build

  docs-site:
    name: Docs site suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      # See the frontend job: same Windows-lockfile hazard, same workaround as
      # deploy-site.yml.
      - run: rm -f package-lock.json && npm install
      # The aggregate run of the six focused suites (worker, admin, download,
      # release-access, migration, site).
      - run: node --test *.test.js
      # docs-site is only built on pushes that touch its paths (deploy-site.yml),
      # so building here is what catches a docs change breaking it on a PR.
      - run: npm run build
