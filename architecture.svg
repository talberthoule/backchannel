<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for gradients and effects -->
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0081bc" />
      <stop offset="100%" stop-color="#005b8a" />
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e16" />
      <stop offset="100%" stop-color="#e68a00" />
    </linearGradient>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#fcfcfd" />
  
  <!-- Section: Client Layer -->
  <g transform="translate(50, 50)">
    <rect width="320" height="700" rx="24" fill="white" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="1" />
    <text x="160" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="18" fill="#1e293b">CLIENT LAYER (React)</text>
    
    <!-- Audio Capture -->
    <g transform="translate(20, 80)">
      <rect width="280" height="120" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="140" y="35" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">AUDIO CAPTURE</text>
      <rect x="40" y="55" width="200" height="40" rx="8" fill="url(#blueGrad)" />
      <text x="140" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="white">PCM 16kHz Stream</text>
    </g>
    
    <!-- WebSocket Client -->
    <g transform="translate(20, 220)">
      <rect width="280" height="120" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="140" y="35" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">WEBSOCKET MANAGER</text>
      <rect x="40" y="55" width="200" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" />
      <text x="140" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#475569">Bi-directional Events</text>
    </g>
    
    <!-- UI Views -->
    <g transform="translate(20, 360)">
      <rect width="280" height="300" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="140" y="35" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">UI COMPONENTS</text>
      
      <rect x="40" y="60" width="200" height="60" rx="8" fill="white" stroke="#e2e8f0" />
      <text x="140" y="95" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#475569">Pre-Call Setup</text>
      
      <rect x="40" y="130" width="200" height="60" rx="8" fill="white" stroke="#0081bc" stroke-width="2" />
      <text x="140" y="165" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="12" fill="#0081bc">Active Call Dashboard</text>
      
      <rect x="40" y="200" width="200" height="60" rx="8" fill="white" stroke="#e2e8f0" />
      <text x="140" y="235" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#475569">Post-Call Summary</text>
    </g>
  </g>

  <!-- Section: Backend Layer -->
  <g transform="translate(420, 50)">
    <rect width="360" height="700" rx="24" fill="white" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="1" />
    <text x="180" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="18" fill="#1e293b">BACKEND LAYER (FastAPI)</text>
    
    <!-- Audio Handler -->
    <g transform="translate(30, 80)">
      <rect width="300" height="150" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="150" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">REAL-TIME PIPELINE</text>
      
      <rect x="30" y="50" width="240" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" />
      <text x="150" y="75" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#475569">Audio WebSocket Handler</text>
      
      <rect x="30" y="100" width="240" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" />
      <text x="150" y="125" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#475569">Speaker Diarization (VAD)</text>
    </g>
    
    <!-- Transcriber -->
    <g transform="translate(30, 250)">
      <rect width="300" height="100" rx="16" fill="#f1f5f9" stroke="#e2e8f0" />
      <text x="150" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">BATCH TRANSCRIBER</text>
      <rect x="30" y="45" width="240" height="40" rx="8" fill="url(#orangeGrad)" />
      <text x="150" y="70" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="12" fill="white">Whisper / Gemini Flash</text>
    </g>

    <!-- Agent Orchestrator -->
    <g transform="translate(30, 370)">
      <rect width="300" height="300" rx="16" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="150" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="15" fill="#1d4ed8">AGENT ORCHESTRATOR</text>
      
      <!-- Event Bus -->
      <rect x="20" y="50" width="260" height="40" rx="8" fill="white" stroke="#93c5fd" />
      <text x="150" y="75" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#1e40af">Internal Event Bus</text>
      
      <!-- Agent Grid -->
      <g transform="translate(20, 105)">
        <rect width="125" height="80" rx="8" fill="white" stroke="#e2e8f0" />
        <text x="62" y="35" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#475569">Analyst</text>
        <text x="62" y="55" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#475569">(Insights)</text>
        
        <rect x="135" y="0" width="125" height="80" rx="8" fill="white" stroke="#e2e8f0" />
        <text x="197" y="35" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#475569">Specialist</text>
        <text x="197" y="55" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#475569">(Opportunities)</text>
        
        <rect x="0" y="90" width="260" height="80" rx="8" fill="white" stroke="#e2e8f0" />
        <text x="130" y="125" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#475569">Synthesizer Agent</text>
        <text x="130" y="145" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#475569">(Summaries &amp; Post-Call)</text>
      </g>
    </g>
  </g>

  <!-- Section: AI Layer -->
  <g transform="translate(830, 50)">
    <rect width="320" height="350" rx="24" fill="white" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="1" />
    <text x="160" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="18" fill="#1e293b">AI LAYER (Google Gemini)</text>
    
    <g transform="translate(20, 80)">
      <rect width="280" height="110" rx="16" fill="#fef2f2" stroke="#fecaca" />
      <text x="140" y="35" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#991b1b">GEMINI LIVE API</text>
      <text x="140" y="70" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#b91c1c">Real-time Multimodal Analysis</text>
      <text x="140" y="90" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#dc2626">Websocket (Multimodal)</text>
    </g>
    
    <g transform="translate(20, 210)">
      <rect width="280" height="110" rx="16" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="140" y="35" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#166534">GEMINI 1.5 PRO / FLASH</text>
      <text x="140" y="70" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#15803d">Document Context &amp; Synthesis</text>
      <text x="140" y="90" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#16a34a">REST API / Long Context</text>
    </g>
  </g>

  <!-- Section: Persistence -->
  <g transform="translate(830, 420)">
    <rect width="320" height="330" rx="24" fill="white" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="1" />
    <text x="160" y="40" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="18" fill="#1e293b">PERSISTENCE</text>
    
    <g transform="translate(20, 80)">
      <rect width="280" height="220" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="140" y="35" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#64748b">POSTGRESQL DB</text>
      
      <g transform="translate(30, 60)">
        <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">├─ Sessions &amp; Segments</text>
        <text x="0" y="25" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">├─ Speakers &amp; Transcripts</text>
        <text x="0" y="50" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">├─ Real-time Questions</text>
        <text x="0" y="75" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">├─ Directives &amp; Docs</text>
        <text x="0" y="100" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">├─ Agent Configurations</text>
        <text x="0" y="125" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">└─ Offering Matches</text>
      </g>
    </g>
  </g>

  <!-- Connections -->
  <!-- Client to Backend (Audio) -->
  <path d="M 370 170 L 420 170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="395" y="160" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748b">Binary PCM</text>
  
  <!-- Client to Backend (Events) -->
  <path d="M 370 290 L 420 290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="4" />
  <text x="395" y="280" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748b">JSON Events</text>
  
  <!-- Backend to AI (Live) -->
  <path d="M 780 170 L 830 170" stroke="#fecaca" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="805" y="160" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#991b1b">Audio Stream</text>
  
  <!-- Backend to AI (REST) -->
  <path d="M 780 290 L 830 290" stroke="#bbf7d0" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="805" y="280" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#166534">Context/Prompt</text>
  
  <!-- Backend to Persistence -->
  <path d="M 780 600 L 830 600" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="805" y="590" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748b">SQL (Async)</text>
  
  <!-- Pipeline flow -->
  <path d="M 610 230 L 610 250" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrowhead)" />
  <path d="M 610 350 L 610 370" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrowhead)" />
</svg>
