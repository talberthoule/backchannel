.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;!--
THESIS: Turn meeting promises into a shared, editable list that survives the next call.
OWN-WORLD: Backchannel&#x27;s Inter/system type, slate surfaces, teal selection, and divided worksheet rows.
STORY: Find what needs attention, set ownership and timing, close the loop, bring remaining work to the next meeting.
FIRST VIEWPORT: Compact group navigation; open commitments on a single sheet; editable owner, date, and status in each row.
FORM: Local extension of the existing meeting/group experience, interactive concept with fictional data. No identity redesign or production integration.
FINISH: Inspect desktop and mobile, exercise the local interactions, review the mock. Existing product design documents remain authoritative.
--&gt;
&lt;style&gt;
  #bc-commitments {
    --bc-paper: light-dark(#fff, #1e293b);
    --bc-canvas: light-dark(#f1f5f9, #0f172a);
    --bc-soft: light-dark(#f8fafc, #172235);
    --bc-ink: light-dark(#0f172a, #f1f5f9);
    --bc-secondary: light-dark(#475569, #cbd5e1);
    --bc-muted: light-dark(#64748b, #94a3b8);
    --bc-line: light-dark(#cbd5e1, #475569);
    --bc-rule: light-dark(#e2e8f0, #334155);
    --bc-teal: light-dark(#0f766e, #2dd4bf);
    --bc-selected: light-dark(#e6f3f2, #173d40);
    --bc-danger: light-dark(#b91c1c, #fca5a5);
    --bc-warning: light-dark(#92400e, #fcd34d);
    --bc-fill: light-dark(#0f766e, #0f766e);
    --bc-on-fill: #fff;
    font-family: &quot;Inter Variable&quot;, Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif;
    font-size: 14px; line-height: 1.5; color: var(--bc-ink);
    background: var(--bc-canvas); border: 1px solid var(--bc-line); border-radius: 12px;
    overflow: clip; text-align: left; container-type: inline-size;
  }
  #bc-commitments * { box-sizing: border-box; }
  #bc-commitments [hidden] { display: none !important; }
  #bc-commitments h2, #bc-commitments h3, #bc-commitments p { margin: 0; }
  #bc-commitments button, #bc-commitments input, #bc-commitments select { font: inherit; color: inherit; }
  #bc-commitments button { cursor: pointer; }
  #bc-commitments button:focus-visible, #bc-commitments input:focus-visible, #bc-commitments select:focus-visible, #bc-commitments summary:focus-visible { outline: 2px solid var(--bc-teal); outline-offset: 3px; }
  #bc-commitments ::selection { background: var(--bc-selected); color: var(--bc-ink); }
  #bc-commitments input { caret-color: var(--bc-teal); }
  #bc-commitments .bc-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 22px; background: var(--bc-paper); border-bottom: 1px solid var(--bc-rule); }
  #bc-commitments .bc-brand { display: flex; align-items: center; gap: 9px; font-size: 18px; font-weight: 650; letter-spacing: -.025em; }
  #bc-commitments .bc-brand i, #bc-commitments .bc-brand svg { color: var(--bc-teal); width: 22px; height: 22px; }
  #bc-commitments .bc-caption { color: var(--bc-muted); font-size: 12px; }
  #bc-commitments .bc-shell { display: grid; grid-template-columns: 178px minmax(0, 1fr); }
  #bc-commitments .bc-nav { padding: 22px 12px; background: var(--bc-paper); border-right: 1px solid var(--bc-rule); }
  #bc-commitments .bc-group { padding: 0 10px 14px; font-size: 13px; font-weight: 600; }
  #bc-commitments .bc-nav button { display: block; text-align: left; width: 100%; min-height: 44px; padding: 9px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--bc-secondary); font-size: 13px; }
  #bc-commitments .bc-nav button[aria-pressed=&quot;true&quot;] { background: var(--bc-selected); color: var(--bc-teal); font-weight: 600; }
  #bc-commitments .bc-nav button:hover { background: var(--bc-soft); }
  #bc-commitments .bc-nav button[aria-pressed=&quot;true&quot;]:hover { background: var(--bc-selected); }
  #bc-commitments .bc-nav-label { font-size: 12px; color: var(--bc-muted); padding: 24px 10px 4px; }
  #bc-commitments .bc-main { padding: 28px 24px 20px; min-width: 0; }
  #bc-commitments .bc-heading { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }
  #bc-commitments h2 { font-size: 26px; line-height: 1.2; letter-spacing: -.025em; font-weight: 650; text-wrap: balance; }
  #bc-commitments .bc-subtitle { color: var(--bc-secondary); margin-top: 8px; font-size: 13px; }
  #bc-commitments .bc-button { display: inline-flex; gap: 6px; align-items: center; justify-content: center; border: 1px solid var(--bc-line); background: var(--bc-paper); border-radius: 6px; padding: 8px 12px; min-height: 40px; font-weight: 500; }
  #bc-commitments .bc-button:hover { background: var(--bc-soft); }
  #bc-commitments .bc-primary { background: var(--bc-fill); color: var(--bc-on-fill); border-color: var(--bc-fill); }
  #bc-commitments .bc-primary:hover { background: var(--bc-fill); opacity: .9; }
  #bc-commitments .bc-sheet { background: var(--bc-paper); border-radius: 12px; padding: 0 20px; }

  #bc-commitments .bc-cols, #bc-commitments .bc-row { display: grid; grid-template-columns: minmax(180px, 1fr) 108px 124px 108px; gap: 12px; }
  #bc-commitments .bc-cols { padding: 14px 0 8px; color: var(--bc-muted); font-size: 12px; }
  #bc-commitments .bc-list { padding: 0; margin: 0; list-style: none; }
  #bc-commitments .bc-item { border-bottom: 1px solid var(--bc-rule); }
  #bc-commitments .bc-item:last-child { border-bottom: 0; }
  #bc-commitments .bc-row { padding: 17px 0; align-items: start; }
  #bc-commitments .bc-title { color: var(--bc-ink); font-weight: 550; line-height: 1.4; }
  #bc-commitments .bc-source { margin-top: 6px; padding: 0; min-height: 24px; border: 0; text-align: left; background: transparent; font-size: 12px; color: var(--bc-secondary); text-decoration: underline; text-decoration-color: var(--bc-line); text-underline-offset: 3px; }
  #bc-commitments .bc-source:hover { color: var(--bc-teal); }
  #bc-commitments .bc-field { display: flex; flex-direction: column; min-width: 0; gap: 4px; }

  #bc-commitments .bc-field input, #bc-commitments .bc-field select { width: 100%; min-width: 0; min-height: 36px; padding: 6px; border: 1px solid var(--bc-rule); border-radius: 6px; background: var(--bc-paper); font-size: 12px; font-variant-numeric: tabular-nums; }
  #bc-commitments .bc-field input:hover, #bc-commitments .bc-field select:hover { border-color: var(--bc-line); }

  #bc-commitments .bc-detail { padding: 0 0 18px; }
  #bc-commitments .bc-detail-inner { padding: 14px 16px; background: var(--bc-soft); border-radius: 6px; }

  #bc-commitments .bc-next p { margin-top: 5px; color: var(--bc-secondary); font-size: 12px; }

  #bc-commitments .bc-agenda li { margin-bottom: 10px; }
  #bc-commitments .bc-status { min-height: 22px; margin-top: 18px; color: var(--bc-teal); font-size: 12px; }

  @container (max-width: 910px) {

    #bc-commitments .bc-sheet { padding-inline: 14px; }
    #bc-commitments .bc-top { padding: 14px; }
    #bc-commitments h2 { font-size: 23px; }

  }
  @media (pointer: coarse) {
    #bc-commitments button, #bc-commitments input, #bc-commitments select { min-height: 44px !important; }
  }
