    <rect x="26" y="20" width="10" height="56" rx="5" fill="#0d9488" />
    <rect x="42" y="8"  width="10" height="80" rx="5" fill="#0d9488" />
    <rect x="58" y="26" width="10" height="44" rx="5" fill="#0d9488" />
    <rect x="74" y="38" width="10" height="20" rx="5" fill="#0d9488" />
    <rect x="18" y="42" width="10" height="12" rx="5" fill="#2dd4bf" />
    <rect x="34" y="36" width="10" height="24" rx="5" fill="#2dd4bf" />
    <rect x="50" y="40" width="10" height="16" rx="5" fill="#2dd4bf" />
    <rect x="66" y="44" width="10" height="8"  rx="5" fill="#2dd4bf" />
  </g>
  <text class="wm-text" x="102" y="63" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1">backchannel</text>
</svg>
