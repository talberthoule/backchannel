<svg width="520" height="96" viewBox="0 0 520 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Backchannel">
  <style>
    .wm-text { fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .wm-text { fill: #e2e8f0; }
